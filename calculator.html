<!DOCTYPE html>
<html dir="ltr" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="JavaScript calculator project" name="description"/>
  <title>
   Calculator | Portfolio
  </title>
  <script>
   try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')||'dark';document.documentElement.dir='ltr'}catch(e){document.documentElement.dataset.theme='dark'}
  </script>
  <link href="./css/style.css" rel="stylesheet"/>
  <script defer="" src="./js/main.js">
  </script>
  <script defer="" src="./js/calculator.js">
  </script>
 </head>
 <body>
  <header class="site-header">
   <nav class="nav container">
    <a class="brand" href="./index.html">
     PORTFOLIO
     <span class="dot">
      .
     </span>
    </a>
    <a class="back-link" href="./index.html#projects">
     ← Back to Portfolio
    </a>
    <div class="nav-actions">
     <button aria-label="Switch color theme" class="icon-button theme-button" type="button">
      <svg aria-hidden="true" class="theme-icon theme-icon-sun" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24">
       <circle cx="12" cy="12" r="4">
       </circle>
       <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42">
       </path>
      </svg>
      <svg aria-hidden="true" class="theme-icon theme-icon-moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
       <path d="M20.5 14.8A9 9 0 1 1 9.2 3.5A7 7 0 0 0 20.5 14.8Z">
       </path>
      </svg>
     </button>
    </div>
   </nav>
  </header>
  <main class="calculator-page container">
   <div class="calculator-intro">
    <span class="eyebrow">
     JAVASCRIPT PROJECT / 01
    </span>
    <h1>
     Calculator
    </h1>
    <p>
     A simple, keyboard-friendly calculator made with HTML, CSS and JavaScript.
    </p>
   </div>
   <section aria-label="Calculator" class="calculator">
    <div aria-live="polite" class="calculator-display">
     <div class="calc-history" id="calcHistory">
     </div>
     <div class="calc-value" id="calcDisplay">
      0
     </div>
    </div>
    <div class="calculator-grid">
     <button class="calc-key utility" data-action="clear">
      AC
     </button>
     <button class="calc-key utility" data-action="sign">
      ±
     </button>
     <button class="calc-key utility" data-action="percent">
      %
     </button>
     <button class="calc-key operator" data-action="operator" data-value="/">
      ÷
     </button>
     <button class="calc-key" data-action="digit" data-value="7">
      7
     </button>
     <button class="calc-key" data-action="digit" data-value="8">
      8
     </button>
     <button class="calc-key" data-action="digit" data-value="9">
      9
     </button>
     <button class="calc-key operator" data-action="operator" data-value="*">
      ×
     </button>
     <button class="calc-key" data-action="digit" data-value="4">
      4
     </button>
     <button class="calc-key" data-action="digit" data-value="5">
      5
     </button>
     <button class="calc-key" data-action="digit" data-value="6">
      6
     </button>
     <button class="calc-key operator" data-action="operator" data-value="-">
      −
     </button>
     <button class="calc-key" data-action="digit" data-value="1">
      1
     </button>
     <button class="calc-key" data-action="digit" data-value="2">
      2
     </button>
     <button class="calc-key" data-action="digit" data-value="3">
      3
     </button>
     <button class="calc-key operator" data-action="operator" data-value="+">
      +
     </button>
     <button aria-label="Backspace" class="calc-key utility" data-action="backspace">
      ⌫
     </button>
     <button class="calc-key" data-action="digit" data-value="0">
      0
     </button>
     <button class="calc-key" data-action="decimal">
      .
     </button>
     <button class="calc-key equals" data-action="equals">
      =
     </button>
    </div>
   </section>
   <p class="calculator-hint">
    Tip: use your keyboard (0–9, +, -, *, /, Enter, Backspace, Escape).
   </p>
  </main>
  <footer class="footer">
   <div class="container footer-inner">
    <span>
     ©
     <span id="year">
     </span>
     <span class="footer-name">
      YOUR NAME
     </span>
    </span>
    <span>
     Built with HTML, CSS &amp; JavaScript.
    </span>
   </div>
  </footer>
 </body>
</html>
